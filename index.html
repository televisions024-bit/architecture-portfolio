<!DOCTYPE html>
<!-- ============================================================
  COVER PAGE — marked DONE in PROJECT.md. Do not restyle later.
  WHAT YOU CAN EDIT SAFELY:
  - drop your real cover drawing as /images/cover/hero.png
  - the three text lines below (only if Mohammed asks)
  WHAT YOU MUST NOT DO: move the text away from the empty left
  half of the image, add animation, or change the design.
============================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio 2024-27 — Mohammed Huzefa</title>
  <meta name="description" content="Architecture portfolio of Mohammed Huzefa, 2024-27. Architecture internship portfolio.">
  <link rel="stylesheet" href="styles.css">
  <!-- Cover-only styles are kept here on purpose: they must not
       affect the project page template. -->
  <style>
    .cover {
      position: relative;
      min-height: 100vh;              /* full-bleed hero, no scrolling */
      min-height: 100svh;
      overflow: hidden;
    }
    /* The hero PNG: full-bleed, drawing sits visually in the right
       half. object-position keeps it anchored to the right edge on
       wide screens. Eager load — it is the whole page.
       mix-blend-mode: multiply lets the page's background image
       show through the drawing's off-white paper; the black lines
       multiply to black, so they stay black. The pseudo-element
       layers sit at negative z-index directly under this image in
       the root stacking context, so the blend target is them. */
    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center right;
      min-height: 100%;
      mix-blend-mode: multiply;
    }
    /* Text sits in the empty left half, mid-height. */
    .cover-text {
      position: absolute;
      top: 50%;
      left: 6vw;
      transform: translateY(-50%);
      max-width: 44%;
    }
    /* small caption above the title (uppercase, letter-spaced) */
    .cover-kicker {
      font-family: var(--font-body);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);   /* was --grey: fails 4.5:1 over the background image; ink passes (2026-11-02) */
    }
    /* short 2px rule, echoes the approved cover */
    .cover-rule {
      width: 28px;
      height: 2px;
      background: var(--ink);
      margin: 22px 0;
      border: 0;
    }
    .cover h1 {
      font-family: var(--font-heading);
      font-weight: normal;
      font-size: clamp(34px, 5.2vw, 72px);
      line-height: 1.06;
      text-transform: uppercase;
      color: var(--ink);
    }
    .cover-sub {
      margin-top: 10px;
      font-family: var(--font-body);
      font-size: clamp(13px, 1.3vw, 16px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
    }
    /* the one link onward: quiet underline, burgundy on hover */
    .cover-link {
      display: inline-block;
      margin-top: 34px;
      font-family: var(--font-body);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 3px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .cover-link:hover { color: var(--accent); border-bottom-color: var(--accent); }
    /* phone: single column, 16px side padding (PROJECT.md section 5) */
    @media (max-width: 719px) {
      .cover { min-height: 100svh; }
      .cover-text { top: auto; bottom: 12vh; left: 16px; right: 16px; max-width: none; transform: none; }
    }
  </style>
</head>
<body>
  <main class="cover">
    <!-- placeholder until the real PNG is dropped in (see ASSETS.md) -->
    <img src="images/cover/hero.png"
         alt="Black-line drawing of a cantilevered building volume with curved corner and glazing mullions on off-white">

    <div class="cover-text">
      <p class="cover-kicker">Portfolio 2024-27</p>
      <hr class="cover-rule">
      <h1>Architecture<br>Internship<br>Portfolio</h1>
      <p class="cover-sub">Presented by Mohammed Huzefa</p>
      <a class="cover-link" href="projects.html">Projects</a>
    </div>
  </main>
  <script src="backgrounds-config.js"></script><!-- background settings, must load first -->
  <script src="backgrounds.js" defer></script>
</body>
</html>
